server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    location /questions {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    location /answers {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }
}
